<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dicionário de Símbolos e Crenças Bíblicas</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d2e;
    --surface2: #242840;
    --border: #2e3256;
    --accent: #6c63ff;
    --accent2: #4caf87;
    --warn: #e8a838;
    --text: #e2e4f0;
    --text-dim: #8890b0;
    --tag-myth: #2a4a6b;
    --tag-myth-text: #7ec8e3;
    --tag-sym: #3b2a6b;
    --tag-sym-text: #b39ddb;
    --tag-mod: #1e4a35;
    --tag-mod-text: #80cba6;
    --tag-bib: #5c2a1e;
    --tag-bib-text: #f4a261;
    --tag-hist: #2a3a20;
    --tag-hist-text: #aed581;
    --tag-conc: #4a2a40;
    --tag-conc-text: #f48fb1;
    --tag-cin: #2a1a3a;
    --tag-cin-text: #ce93d8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #1a1d2e 0%, #242840 100%);
    border-bottom: 1px solid var(--border);
    padding: 28px 24px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .header h1 {
    font-size: 1.4rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.02em;
  }
  .header h1 span { color: var(--accent); }
  .header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .header p { font-size: 0.8rem; color: var(--text-dim); margin-top: 4px; }
  .about-link {
    flex-shrink: 0;
    font-size: 0.75rem;
    color: var(--text-dim);
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 12px;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .about-link:hover { color: #fff; border-color: var(--accent); }
  .source-badge {
    display: inline-block;
    margin-top: 6px;
    font-size: 0.7rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 10px;
    color: var(--text-dim);
  }

  /* CONTROLS */
  .controls {
    padding: 16px 24px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0; /* atualizado via JS */
    z-index: 90;
  }
  .search-wrap {
    position: relative;
    margin-bottom: 12px;
  }
  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
  }
  #search {
    width: 100%;
    padding: 10px 16px 10px 40px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--text-dim); }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .filters label { font-size: 0.75rem; color: var(--text-dim); margin-right: 4px; }
  .filter-btn {
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .count-badge {
    margin-left: auto;
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
    padding: 20px 24px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* CARD */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--cat-color, var(--accent));
    border-radius: 12px 12px 0 0;
  }
  .card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(108,99,255,0.15);
  }
  .card.hidden { display: none; }

  .card-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 10px;
  }
  .card-icon {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    flex-shrink: 0;
    background: var(--surface2);
  }
  .card-title h2 {
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
  }
  .card-title .aliases {
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .cat-tag {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 8px;
    border-radius: 4px;
    margin-top: 4px;
  }

  .card-summary {
    font-size: 0.82rem;
    color: var(--text-dim);
    line-height: 1.5;
    margin-bottom: 12px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .refs-preview {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .ref-chip {
    font-size: 0.68rem;
    padding: 2px 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
  }
  .ref-chip:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    max-width: 680px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 24px 64px rgba(0,0,0,0.6);
    position: relative;
  }
  .modal-top-bar {
    height: 4px;
    background: var(--cat-color, var(--accent));
    border-radius: 16px 16px 0 0;
  }
  .modal-body { padding: 24px; }
  .modal-close {
    position: sticky;
    top: 0;
    float: right;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-dim);
    padding: 4px 10px;
    cursor: pointer;
    font-size: 0.8rem;
    margin-bottom: 8px;
    z-index: 10;
  }
  .modal-close:hover { color: #fff; border-color: var(--accent); }
  .modal h2 {
    font-size: 1.5rem;
    color: #fff;
    margin-bottom: 4px;
  }
  .modal .modal-aliases {
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 12px;
  }

  .section-block {
    margin-bottom: 20px;
  }
  .section-block h3 {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .fact-block {
    background: rgba(76,175,135,0.08);
    border-left: 3px solid var(--accent2);
    border-radius: 0 6px 6px 0;
    padding: 10px 14px;
    margin-bottom: 8px;
  }
  .interp-block {
    background: rgba(232,168,56,0.08);
    border-left: 3px solid var(--warn);
    border-radius: 0 6px 6px 0;
    padding: 10px 14px;
    margin-bottom: 8px;
  }
  .fact-block p, .interp-block p {
    font-size: 0.85rem;
    line-height: 1.6;
    color: var(--text);
  }
  .fact-label, .interp-label {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }
  .fact-label { color: var(--accent2); }
  .interp-label { color: var(--warn); }

  .ref-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .ref-link {
    font-size: 0.78rem;
    padding: 4px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--accent);
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
  }
  .ref-link:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .scripture-ref {
    font-size: 0.78rem;
    color: var(--tag-bib-text);
    background: rgba(244,162,97,0.1);
    border-radius: 4px;
    padding: 2px 8px;
    display: inline-block;
    margin: 2px;
  }

  .empty-state {
    grid-column: 1/-1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
    font-size: 0.9rem;
  }

  /* JORNADAS (trilhas temáticas) */
  .journeys {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px 24px 0;
  }
  .journeys-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .journeys-header h2 {
    font-size: 0.95rem;
    font-weight: 700;
    color: #fff;
  }
  .journeys-header h2 span { color: var(--accent); }
  .journeys-toggle {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-dim);
    padding: 3px 10px;
    cursor: pointer;
    font-size: 0.72rem;
  }
  .journeys-toggle:hover { color: #fff; border-color: var(--accent); }
  .journeys-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 12px;
  }
  .journeys-grid.collapsed { display: none; }
  .journey-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    transition: border-color 0.2s;
  }
  .journey-card:hover { border-color: var(--accent); }
  .journey-title {
    font-size: 0.88rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 4px;
  }
  .journey-desc {
    font-size: 0.75rem;
    color: var(--text-dim);
    line-height: 1.5;
    margin-bottom: 8px;
  }
  .journey-path {
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-bottom: 10px;
    opacity: 0.8;
  }
  .journey-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .journey-start {
    background: var(--accent);
    border: none;
    border-radius: 6px;
    color: #fff;
    padding: 5px 14px;
    cursor: pointer;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .journey-start:hover { opacity: 0.85; }
  .journey-meta { font-size: 0.7rem; color: var(--text-dim); }

  /* Barra da jornada dentro do modal */
  .journey-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(108,99,255,0.1);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 8px 12px;
    margin-bottom: 14px;
    font-size: 0.75rem;
    color: var(--text);
    flex-wrap: wrap;
  }
  .journey-bar-title { font-weight: 600; color: var(--accent); }
  .journey-bar-progress { color: var(--text-dim); }
  .journey-nav {
    margin-left: auto;
    display: flex;
    gap: 6px;
  }
  .journey-nav button {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 3px 10px;
    cursor: pointer;
    font-size: 0.75rem;
  }
  .journey-nav button:hover:not(:disabled) { border-color: var(--accent); color: #fff; }
  .journey-nav button:disabled { opacity: 0.35; cursor: default; }

  /* CLEAR SEARCH BUTTON */
  .search-clear {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 1rem;
    display: none;
    padding: 2px 8px;
    line-height: 1;
    border-radius: 4px;
  }
  .search-clear.visible { display: block; }
  .search-clear:hover { color: var(--text); background: var(--surface2); }

  /* MODAL BACK BUTTON */
  .modal-back {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-dim);
    padding: 4px 10px;
    cursor: pointer;
    font-size: 0.8rem;
    margin-right: 6px;
    margin-bottom: 8px;
  }
  .modal-back:hover { color: #fff; border-color: var(--accent); }

  /* TRILHA DE NAVEGAÇÃO (breadcrumb) */
  .modal-trail {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 2px;
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-bottom: 10px;
    line-height: 1.8;
  }
  .trail-crumb {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font-size: 0.72rem;
    padding: 1px 4px;
    border-radius: 4px;
  }
  .trail-crumb:hover { background: var(--surface2); text-decoration: underline; }
  .trail-current { color: var(--text); font-weight: 600; padding: 1px 4px; }
  .trail-sep { color: var(--border); }

  /* COPIAR LINK */
  .modal-share {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-dim);
    padding: 4px 10px;
    cursor: pointer;
    font-size: 0.8rem;
    margin-right: 6px;
    margin-bottom: 8px;
  }
  .modal-share:hover { color: #fff; border-color: var(--accent2); }
  .modal-share.copied { color: var(--accent2); border-color: var(--accent2); }

  /* SCROLL TO TOP */
  .scroll-top {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 42px;
    height: 42px;
    background: var(--accent);
    border: none;
    border-radius: 50%;
    color: #fff;
    font-size: 1.2rem;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.2s;
    z-index: 150;
    box-shadow: 0 4px 16px rgba(108,99,255,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .scroll-top.visible { opacity: 1; pointer-events: auto; }
  .scroll-top:hover { transform: translateY(-2px); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>📖 Dicionário de <span>Símbolos e Crenças</span></h1>
    <a class="about-link" href="sobre.html">👁️ Sobre o projeto</a>
  </div>
  <p>Sistema de referência cruzada · símbolos, entidades e conceitos bíblicos</p>
</div>

<div class="controls">
  <div class="search-wrap">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="search" type="text" placeholder="Buscar símbolo, nome, conceito… (tecle / para focar)" autocomplete="off">
    <button class="search-clear" id="searchClear" title="Limpar busca">✕</button>
  </div>
  <div class="filters">
    <label>Filtrar:</label>
    <button class="filter-btn active" data-cat="all">Todos</button>
    <button class="filter-btn" data-cat="divindade">🏛️ Divindades</button>
    <button class="filter-btn" data-cat="simbolo">🔣 Símbolos</button>
    <button class="filter-btn" data-cat="moderno">💻 Manifestações Modernas</button>
    <button class="filter-btn" data-cat="biblico">📖 Conceitos Bíblicos</button>
    <button class="filter-btn" data-cat="historico">👤 Figuras Históricas</button>
    <button class="filter-btn" data-cat="cinema">🎬 Cinema</button>
    <span class="count-badge" id="count"></span>
  </div>
  <!-- FILTRO POR FONTE (desativado — descomentar quando necessário)
  <div class="filters" style="margin-top:8px">
    <label>Fonte:</label>
    <button class="filter-btn src-btn active" data-src="all">Todas</button>
    <button class="filter-btn src-btn" data-src="1">📺 Live #1 · Greenman</button>
    <button class="filter-btn src-btn" data-src="2">📺 Live #2 · Segunda Besta</button>
    <button class="filter-btn src-btn" data-src="3">📺 Live #3 · Deus Destruirá o Sistema</button>
  </div>
  -->
</div>

<div class="journeys" id="journeys">
  <div class="journeys-header">
    <h2>🧭 <span>Jornadas</span> — trilhas de leitura guiada</h2>
    <button class="journeys-toggle" id="journeysToggle">Ocultar</button>
  </div>
  <div class="journeys-grid" id="journeysGrid"></div>
</div>

<div class="grid" id="grid"></div>

<button class="scroll-top" id="scrollTop" title="Voltar ao topo">↑</button>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-top-bar" id="modalBar"></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="simbolos.js"></script>
<script>
const CATS = {
  divindade: { label: 'Divindade / Mitologia', color: '#7ec8e3', bg: 'var(--tag-myth)', text: 'var(--tag-myth-text)', icon: '🏛️' },
  simbolo:   { label: 'Símbolo', color: '#b39ddb', bg: 'var(--tag-sym)', text: 'var(--tag-sym-text)', icon: '🔣' },
  moderno:   { label: 'Manifestação Moderna', color: '#80cba6', bg: 'var(--tag-mod)', text: 'var(--tag-mod-text)', icon: '💻' },
  biblico:   { label: 'Conceito Bíblico / Espiritual', color: '#f4a261', bg: 'var(--tag-bib)', text: 'var(--tag-bib-text)', icon: '📖' },
  historico: { label: 'Figura Histórica', color: '#aed581', bg: 'var(--tag-hist)', text: 'var(--tag-hist-text)', icon: '👤' },
  cinema:    { label: 'Cinema / Mídia', color: '#ce93d8', bg: 'var(--tag-cin)', text: 'var(--tag-cin-text)', icon: '🎬' },
};

// --- STICKY CONTROLS ---
const headerEl = document.querySelector('.header');
const controlsEl = document.querySelector('.controls');
function updateControlsTop() {
  controlsEl.style.top = headerEl.offsetHeight + 'px';
}
updateControlsTop();
window.addEventListener('resize', updateControlsTop);

// --- SCROLL TO TOP ---
const scrollTopBtn = document.getElementById('scrollTop');
window.addEventListener('scroll', () => {
  scrollTopBtn.classList.toggle('visible', window.scrollY > 300);
});
scrollTopBtn.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// --- ÍNDICE DE REFS BIDIRECIONAL ---
// Calculado uma vez ao carregar: backRefsMap[id] = [ids que referenciam este id]
const backRefsMap = {};
DATA.forEach(d => {
  (d.refs || []).forEach(ref => {
    if (!backRefsMap[ref]) backRefsMap[ref] = [];
    backRefsMap[ref].push(d.id);
  });
});

// --- CONTAGEM POR CATEGORIA ---
function updateFilterCounts() {
  const counts = {};
  DATA.forEach(d => { counts[d.cat] = (counts[d.cat] || 0) + 1; });
  document.querySelectorAll('.filter-btn[data-cat]').forEach(btn => {
    const cat = btn.dataset.cat;
    if (cat === 'all') {
      btn.textContent = `Todos (${DATA.length})`;
    } else if (counts[cat]) {
      const label = btn.textContent.replace(/ \(\d+\)$/, '');
      btn.textContent = `${label} (${counts[cat]})`;
    }
  });
}

// --- JORNADAS (trilhas temáticas curadas) ---
// Para reverter: remova este bloco, a div #journeys no HTML e o CSS .journey*
const TRILHAS = [
  {
    id: 'gotthard',
    titulo: 'A saga do Túnel de Gotthard',
    desc: 'Da lenda da ponte com o demônio ao ritual de 2016: quem é Azazel e o que a cerimônia encenou diante dos líderes da Europa.',

  {

  {

    desc: 'Gaia, Ísis, Ishtar, a Rainha do Céu: o mesmo arquétipo feminino adaptado a cada cultura ao longo de milênios.',

  {

  },
  {

    desc: 'Transhumanismo, IA e a promessa de imortalidade: a terceira tentativa de "ser como Deus".',
    ids: ['transhumanismo', 'quimera-genetica', 'singularidade', 'ia-como-besta', 'segunda-besta'],
  },
];

let currentTrail = null;   // trilha ativa
let currentTrailIdx = 0;   // posição na trilha

function trailProgressKey(tid) { return 'trilha-' + tid; }
function getTrailProgress(tid) {
  try { const v = localStorage.getItem(trailProgressKey(tid)); return v === null ? null : parseInt(v, 10); } catch (e) { return null; }
}
function setTrailProgress(tid, idx) {
  try { localStorage.setItem(trailProgressKey(tid), String(idx)); } catch (e) {}
}

function renderJourneys() {
  const wrap = document.getElementById('journeysGrid');
  wrap.innerHTML = TRILHAS.map(t => {
    const names = t.ids.map(id => {
      const d = DATA.find(x => x.id === id);
      return d ? d.name.split(' (')[0] : id;
    }).join(' › ');
    const prog = getTrailProgress(t.id);
    const btnLabel = (prog !== null && prog > 0 && prog < t.ids.length - 1)
      ? `Continuar · ${prog + 1}/${t.ids.length}`
      : 'Começar leitura';
    return `
      <div class="journey-card">
        <div class="journey-title">${t.titulo}</div>
        <div class="journey-desc">${t.desc}</div>
        <div class="journey-path">${names}</div>
        <div class="journey-actions">
          <button class="journey-start" data-trail="${t.id}">${btnLabel}</button>
          <span class="journey-meta">${t.ids.length} símbolos</span>
        </div>
      </div>`;
  }).join('');

  wrap.querySelectorAll('.journey-start').forEach(btn => {
    btn.addEventListener('click', () => {
      const trail = TRILHAS.find(t => t.id === btn.dataset.trail);
      if (!trail) return;
      const saved = getTrailProgress(trail.id);
      const startIdx = (saved !== null && saved > 0 && saved < trail.ids.length - 1) ? saved : 0;
      startTrail(trail, startIdx);
    });
  });
}

function startTrail(trail, idx = 0) {
  currentTrail = trail;
  currentTrailIdx = idx;
  openModal(trail.ids[idx]);
}

function trailGo(delta) {
  if (!currentTrail) return;
  const next = currentTrailIdx + delta;
  if (next < 0 || next >= currentTrail.ids.length) return;
  currentTrailIdx = next;
  setTrailProgress(currentTrail.id, next);
  openModal(currentTrail.ids[next]);
}

// Toggle mostrar/ocultar jornadas (persistido)
const journeysToggle = document.getElementById('journeysToggle');
const journeysGrid = document.getElementById('journeysGrid');
function applyJourneysCollapsed(collapsed) {
  journeysGrid.classList.toggle('collapsed', collapsed);
  journeysToggle.textContent = collapsed ? 'Mostrar' : 'Ocultar';
}
let journeysCollapsed = false;
try { journeysCollapsed = localStorage.getItem('jornadas-ocultas') === '1'; } catch (e) {}
applyJourneysCollapsed(journeysCollapsed);
journeysToggle.addEventListener('click', () => {
  journeysCollapsed = !journeysCollapsed;
  applyJourneysCollapsed(journeysCollapsed);
  try { localStorage.setItem('jornadas-ocultas', journeysCollapsed ? '1' : '0'); } catch (e) {}
});

// --- RENDER ---
const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
let activeFilter = 'all';
let searchTerm = '';
let modalHistory = []; // stack de navegação interna do modal

function getCatColor(cat) {
  const colors = {
    divindade: '#7ec8e3',
    simbolo: '#b39ddb',
    moderno: '#80cba6',
    biblico: '#f4a261',
    historico: '#aed581',
    cinema: '#ce93d8',
  };
  return colors[cat] || '#6c63ff';
}

// Normaliza string removendo acentos para busca sem acento encontrar resultados acentuados
function norm(str) {
  return (str || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
}

function renderCards() {
  const filtered = DATA.filter(d => {
    const matchCat = activeFilter === 'all' || d.cat === activeFilter;
    const term = norm(searchTerm);
    // Busca expandida: nome, aliases, resumo, fatos e interpretações (sem acento obrigatório)
    const matchSearch = !term ||
      norm(d.name).includes(term) ||
      (d.aliases || []).some(a => norm(a).includes(term)) ||
      norm(d.summary).includes(term) ||
      (d.facts || []).some(f => norm(f).includes(term)) ||
      (d.interps || []).some(i => norm(i).includes(term));
    return matchCat && matchSearch;
  });

  grid.innerHTML = '';

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state">Nenhum símbolo encontrado para essa busca.</div>';
    countEl.textContent = '0 resultados';
    return;
  }

  countEl.textContent = `${filtered.length} símbolo${filtered.length !== 1 ? 's' : ''}`;

  filtered.forEach(d => {
    const cat = CATS[d.cat];
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--cat-color', getCatColor(d.cat));
    card.dataset.id = d.id;

    const refChips = (d.refs || []).slice(0, 4).map(ref => {
      const refData = DATA.find(x => x.id === ref);
      return refData ? `<span class="ref-chip" data-ref="${ref}">${refData.icon} ${refData.name.split(' ')[0]}</span>` : '';
    }).join('');

    card.innerHTML = `
      <div class="card-header">
        <div class="card-icon">${d.icon}</div>
        <div class="card-title">
          <h2>${d.name}</h2>
          ${d.aliases ? `<div class="aliases">Também: ${d.aliases.join(', ')}</div>` : ''}
          <span class="cat-tag" style="background:${cat.bg};color:${cat.text}">${cat.icon} ${cat.label}</span>
        </div>
      </div>
      <p class="card-summary">${d.summary}</p>
      ${refChips ? `<div class="refs-preview">${refChips}</div>` : ''}
    `;

    card.addEventListener('click', (e) => {
      if (e.target.classList.contains('ref-chip')) {
        e.stopPropagation();
        openModal(e.target.dataset.ref);
      } else {
        openModal(d.id);
      }
    });

    grid.appendChild(card);
  });
}

function openModal(id, updateHistory = true) {
  const d = DATA.find(x => x.id === id);
  if (!d) return;
  const cat = CATS[d.cat];
  const color = getCatColor(d.cat);

  // Scroll do modal ao topo a cada nova entrada
  document.getElementById('modal').scrollTop = 0;

  document.getElementById('modalBar').style.background = color;

  const facts = (d.facts || []).map(f => `
    <div class="fact-block">
      <div class="fact-label">📚 Fato histórico / documentado</div>
      <p>${f}</p>
    </div>
  `).join('');

  const interps = (d.interps || []).map(i => `
    <div class="interp-block">
      <div class="interp-label">💬 Interpretação do apresentador</div>
      <p>${i}</p>
    </div>
  `).join('');

  const refs = (d.refs || []).map(ref => {
    const refData = DATA.find(x => x.id === ref);
    return refData ? `<span class="ref-link" data-ref="${ref}">${refData.icon} ${refData.name}</span>` : '';
  }).filter(Boolean).join('');

  // Refs bidirecionais: quem referencia esta entrada
  const backRefs = (backRefsMap[id] || []).map(ref => {
    const refData = DATA.find(x => x.id === ref);
    return refData ? `<span class="ref-link" data-ref="${ref}">${refData.icon} ${refData.name}</span>` : '';
  }).filter(Boolean).join('');

  const scriptures = (d.scriptures || []).map(s => `<span class="scripture-ref">📖 ${s}</span>`).join('');

  // --- Trilha de navegação ---
  const currentTop = modalHistory[modalHistory.length - 1];
  if (currentTop !== id) {
    if (updateHistory) {
      modalHistory.push(id);
    } else {
      // Veio do popstate (botão voltar/avançar do navegador)
      if (modalHistory.length > 1 && modalHistory[modalHistory.length - 2] === id) {
        modalHistory.pop(); // voltou um passo
      } else {
        modalHistory.push(id); // avançou
      }
    }
  }

  // Deep link: pushState para o voltar do navegador funcionar
  if (updateHistory && window.location.hash !== '#' + id) {
    history.pushState({ sym: id }, '', '#' + id);
  }

  // Barra da jornada (se o símbolo atual pertence à trilha ativa)
  let journeyBarHtml = '';
  if (currentTrail && currentTrail.ids.includes(id)) {
    currentTrailIdx = currentTrail.ids.indexOf(id);
    setTrailProgress(currentTrail.id, currentTrailIdx);
    const isFirst = currentTrailIdx === 0;
    const isLast = currentTrailIdx === currentTrail.ids.length - 1;
    journeyBarHtml = `
      <div class="journey-bar">
        <span>🧭</span>
        <span class="journey-bar-title">${currentTrail.titulo}</span>
        <span class="journey-bar-progress">${currentTrailIdx + 1} de ${currentTrail.ids.length}</span>
        <div class="journey-nav">
          <button id="trailPrevBtn" ${isFirst ? 'disabled' : ''}>← Anterior</button>
          <button id="trailNextBtn" ${isLast ? 'disabled' : ''}>Próximo →</button>
        </div>
      </div>`;
  }

  const backBtn = modalHistory.length > 1
    ? `<button class="modal-back" id="modalBackBtn">← Voltar</button>`
    : '';

  // Trilha clicável (aparece a partir de 2 itens)
  let trailHtml = '';
  if (modalHistory.length > 1) {
    trailHtml = '<div class="modal-trail">' + modalHistory.map((tid, i) => {
      const td = DATA.find(x => x.id === tid);
      if (!td) return '';
      const label = td.icon + ' ' + td.name.split(' (')[0];
      if (i === modalHistory.length - 1) {
        return `<span class="trail-current">${label}</span>`;
      }
      return `<button class="trail-crumb" data-trail-idx="${i}">${label}</button><span class="trail-sep">›</span>`;
    }).join('') + '</div>';
  }

  document.getElementById('modalBody').innerHTML = `
    <div style="display:flex;align-items:center;margin-bottom:4px">
      ${backBtn}
      <button class="modal-share" id="modalShareBtn" title="Copiar link desta entrada">🔗 Copiar link</button>
      <button class="modal-close" id="modalCloseBtn">✕ Fechar</button>
    </div>
    ${journeyBarHtml}
    ${trailHtml}
    <h2>${d.icon} ${d.name}</h2>
    ${d.aliases ? `<div class="modal-aliases">Nomes alternativos: ${d.aliases.join(' · ')}</div>` : ''}
    <span class="cat-tag" style="background:${cat.bg};color:${cat.text};margin-bottom:16px;display:inline-block">${cat.icon} ${cat.label}</span>

    <div class="section-block">
      <h3>Resumo</h3>
      <p style="font-size:0.9rem;line-height:1.6;color:var(--text)">${d.summary}</p>
    </div>

    ${facts ? `<div class="section-block"><h3>Fatos históricos / documentados</h3>${facts}</div>` : ''}
    ${interps ? `<div class="section-block"><h3>Interpretação (apresentador)</h3>${interps}</div>` : ''}
    ${scriptures ? `<div class="section-block"><h3>Referências bíblicas</h3><div>${scriptures}</div></div>` : ''}
    ${refs ? `<div class="section-block"><h3>Símbolos relacionados</h3><div class="ref-list">${refs}</div></div>` : ''}
    ${backRefs ? `<div class="section-block"><h3>Referenciado por</h3><div class="ref-list">${backRefs}</div></div>` : ''}
  `;

  document.getElementById('modalCloseBtn').addEventListener('click', () => closeModal());

  // Navegação da jornada
  const trailPrev = document.getElementById('trailPrevBtn');
  const trailNext = document.getElementById('trailNextBtn');
  if (trailPrev) trailPrev.addEventListener('click', () => trailGo(-1));
  if (trailNext) trailNext.addEventListener('click', () => trailGo(1));

  // Copiar link da entrada
  document.getElementById('modalShareBtn').addEventListener('click', (e) => {
    const url = window.location.origin + window.location.pathname + '#' + id;
    navigator.clipboard.writeText(url).then(() => {
      const btn = e.currentTarget || document.getElementById('modalShareBtn');
      btn.textContent = '✓ Copiado!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '🔗 Copiar link';
        btn.classList.remove('copied');
      }, 1600);
    });
  });

  const backBtnEl = document.getElementById('modalBackBtn');
  if (backBtnEl) {
    backBtnEl.addEventListener('click', () => {
      modalHistory.pop(); // remove entrada atual
      const prevId = modalHistory[modalHistory.length - 1];
      if (prevId) openModal(prevId, true);
      else closeModal();
    });
  }

  // Cliques na trilha: volta ao ponto clicado
  document.querySelectorAll('#modalBody .trail-crumb').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.trailIdx, 10);
      const targetId = modalHistory[idx];
      modalHistory = modalHistory.slice(0, idx); // trunca (openModal re-adiciona)
      openModal(targetId, true);
    });
  });

  document.querySelectorAll('#modalBody .ref-link').forEach(el => {
    el.addEventListener('click', () => openModal(el.dataset.ref));
  });

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(fromPopstate = false) {
  document.getElementById('modalOverlay').classList.remove('open');
  modalHistory = []; // limpa trilha ao fechar
  if (currentTrail) {
    currentTrail = null; // sai da jornada (progresso fica salvo)
    renderJourneys(); // atualiza botões "Continuar · n/N"
  }
  if (!fromPopstate && window.location.hash) {
    // Empilha estado sem hash — o voltar do navegador pode reabrir a última entrada
    history.pushState(null, '', window.location.pathname + window.location.search);
  }
}

// Voltar/avançar do navegador navega entre símbolos
window.addEventListener('popstate', () => {
  const id = window.location.hash.slice(1);
  if (id && DATA.find(x => x.id === id)) {
    openModal(id, false);
  } else {
    closeModal(true);
  }
});

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

document.querySelectorAll('.filter-btn:not(.src-btn)').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn:not(.src-btn)').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.cat;
    renderCards();
  });
});

/* LISTENER FONTE (desativado — descomentar junto com os botões acima)
document.querySelectorAll('.src-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.src-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeSource = btn.dataset.src;
    renderCards();
  });
});
*/

const searchInput = document.getElementById('search');
const searchClear = document.getElementById('searchClear');

searchInput.addEventListener('input', (e) => {
  searchTerm = e.target.value;
  searchClear.classList.toggle('visible', searchTerm.length > 0);
  renderCards();
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchTerm = '';
  searchClear.classList.remove('visible');
  searchInput.focus();
  renderCards();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('modalOverlay').classList.contains('open')) {
      closeModal();
    } else {
      // Esc fora do modal limpa a busca se houver texto
      if (searchTerm) {
        searchInput.value = '';
        searchTerm = '';
        searchClear.classList.remove('visible');
        renderCards();
      }
    }
  }
  // Tecla / foca a busca (se não estiver em input)
  if (e.key === '/' && document.activeElement !== searchInput && !document.getElementById('modalOverlay').classList.contains('open')) {
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
  }
});

// Inicializa
updateFilterCounts();
renderJourneys();
renderCards();

// Deep link: abre modal se URL tiver hash ao carregar
const initialHash = window.location.hash.slice(1);
if (initialHash && DATA.find(x => x.id === initialHash)) {
  openModal(initialHash);
}
</script>
